services:
  - type: web
    name: careerpilot-api
    env: node
    plan: free # Change to starter/pro if you need more resources
    buildCommand: pnpm install && pnpm run prisma:generate && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set this in the Render dashboard!
      - key: REDIS_URL
        sync: false # Set this in the Render dashboard!
      - key: CORS_ORIGIN
        sync: false # Set this to your frontend URL (e.g., https://careerpilot.vercel.app)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      # Add other environment variables (e.g., OPENAI_API_KEY, CLOUDINARY) in the Render dashboard
